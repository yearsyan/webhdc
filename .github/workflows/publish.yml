name: Publish @webhdc/core to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # reads packageManager from root package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 注意：使用 npm Trusted Publishing 时，不要设置 registry-url + NODE_AUTH_TOKEN，
          # 否则 npm CLI 会优先使用长期 token，而不是 GitHub OIDC 短时令牌。

      - name: Verify tag matches package version
        run: |
          VERSION=$(node -p "require('./packages/webhdc/package.json').version")
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match packages/webhdc/package.json version $VERSION"
            exit 1
          fi
          echo "Publishing @webhdc/core@$VERSION from tag v$TAG"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          pnpm run lint
          pnpm run typecheck

      - name: Test @webhdc/core
        run: pnpm --filter @webhdc/core test

      - name: Build @webhdc/core
        run: pnpm --filter @webhdc/core build

      - name: Publish to npm with Trusted Publishing
        working-directory: packages/webhdc
        # npm CLI 会使用 GitHub OIDC token 向 registry 换取一次性发布令牌
        run: npm publish --provenance --access public
