<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob: https://chrome-devtools-frontend.appspot.com; object-src 'none'; script-src 'self' 'unsafe-eval' blob: https://chrome-devtools-frontend.appspot.com; style-src 'self' 'unsafe-inline' https://chrome-devtools-frontend.appspot.com; img-src 'self' data: blob: https://chrome-devtools-frontend.appspot.com; connect-src 'self' https://chrome-devtools-frontend.appspot.com https://chromeuxreport.googleapis.com; worker-src 'self' blob:; frame-src * data: blob:"
    />
    <meta name="referrer" content="no-referrer" />
    <title>WebHDC DevTools</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #202124;
        color: #e8eaed;
        font:
          13px -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      #webhdc-bootstrap {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
      }

      #webhdc-bootstrap[data-error='true'] {
        box-sizing: border-box;
        padding: 32px;
        color: #f28b82;
        line-height: 1.6;
        text-align: center;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="webhdc-bootstrap">正在初始化 WebHDC DevTools bridge…</div>
    <script type="module" src="/src/devtools/frame.ts"></script>
  </body>
</html>
